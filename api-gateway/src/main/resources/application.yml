server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  # Disable Spring MVC auto-config — gateway uses WebFlux
  main:
    web-application-type: reactive

  cloud:
    gateway:
      # Global default filters applied to all routes
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      # Discovery-based routing (lb:// prefix uses Eureka)
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

# Eureka client config
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# JWT secret — must match auth-service exactly
jwt:
  secret: ${JWT_SECRET:TripForge-Super-Secret-Key-2024-Must-Be-At-Least-256-Bits-Long!!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.tripforge.gateway: DEBUG
    reactor.netty: WARN
