server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── API proxy — all /api/* requests forwarded to the API gateway ──────────
    # The browser calls relative /api/... paths (no hostname).
    # Nginx proxies them to api-gateway:8080 on the Docker-internal network.
    # The browser NEVER sees api-gateway or any internal Docker hostname.
    #
    # resolver 127.0.0.11: Docker's internal DNS — re-resolves api-gateway on
    # each request so nginx handles gateway container restarts gracefully.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $upstream_gateway api-gateway;

    location /api/ {
        proxy_pass            http://$upstream_gateway:8080;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_buffering       off;
    }

    # ── SPA routing — all unknown paths serve index.html ─────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache static assets aggressively ─────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}
