# =============================================================================
# TripForge — Full Stack Docker Compose
#
# Usage:
#   cp .env.example .env
#   make up
#   # Wait 2-3 minutes, then:
#   make health
#
# Startup order:
#   1. postgres          (infrastructure — healthchecked)
#   2. discovery-server  (infrastructure — healthchecked)
#   3. All app services start in parallel once postgres + discovery are healthy
#   4. ml-service        (independent — no DB dependency)
#   5. frontend          (starts immediately — static Nginx, no app dependency)
#
# App services (auth, trip, hotel, route, budget, split, gateway) all depend
# only on postgres + discovery-server being healthy. They do NOT depend on
# each other — Spring Boot + Eureka handles service discovery at runtime.
#
# Database schemas (all in one postgres container):
#   auth         → auth-service
#   trip         → trip-service
#   hotel        → hotel-service
#   route        → route-service
#   budget       → budget-service
#   split_schema → split-service
# =============================================================================

networks:
  tripforge-net:
    driver: bridge
    name: tripforge-net

volumes:
  postgres-data:
    name: tripforge-postgres-data

# =============================================================================
# SERVICES
# =============================================================================
services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tripforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-tripforge}
      POSTGRES_USER:     ${DB_USERNAME:-tripforge_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tripforge_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - tripforge-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tripforge_user} -d ${DB_NAME:-tripforge}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Discovery Server (Eureka) ───────────────────────────────────────────────
  discovery-server:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    container_name: tripforge-discovery
    restart: unless-stopped
    ports:
      - "${DISCOVERY_PORT:-8761}:8761"
    environment:
      SERVER_PORT:      8761
      EUREKA_HOSTNAME:  discovery-server
    networks:
      - tripforge-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8761/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 12

  # ── API Gateway ─────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: tripforge-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      SERVER_PORT:  8080
      EUREKA_URL:   http://discovery-server:8761/eureka/
      JWT_SECRET:   ${JWT_SECRET:-TripForge-Super-Secret-Key-2024-Must-Be-At-Least-256-Bits-Long!!}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - tripforge-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 12

  # ── Auth Service ────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: tripforge-auth
    restart: unless-stopped
    ports:
      - "${AUTH_PORT:-8081}:8081"
    environment:
      SERVER_PORT:        8081
      DB_HOST:            postgres
      DB_PORT:            5432
      DB_NAME:            ${DB_NAME:-tripforge}
      DB_USERNAME:        ${DB_USERNAME:-tripforge_user}
      DB_PASSWORD:        ${DB_PASSWORD:-tripforge_pass}
      EUREKA_URL:         http://discovery-server:8761/eureka/
      JWT_SECRET:         ${JWT_SECRET:-TripForge-Super-Secret-Key-2024-Must-Be-At-Least-256-Bits-Long!!}
      JWT_EXPIRATION_MS:  ${JWT_EXPIRATION_MS:-86400000}
      JPA_DDL_AUTO:       update
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - tripforge-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 12

  # ── Trip Service ────────────────────────────────────────────────────────────
  trip-service:
    build:
      context: ./trip-service
      dockerfile: Dockerfile
    container_name: tripforge-trip
    restart: unless-stopped
    ports:
      - "${TRIP_PORT:-8082}:8082"
    environment:
      SERVER_PORT:  8082
      DB_HOST:      postgres
      DB_PORT:      5432
      DB_NAME:      ${DB_NAME:-tripforge}
      DB_USERNAME:  ${DB_USERNAME:-tripforge_user}
      DB_PASSWORD:  ${DB_PASSWORD:-tripforge_pass}
      EUREKA_URL:   http://discovery-server:8761/eureka/
      JPA_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - tripforge-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 12

  # ── Hotel Service ───────────────────────────────────────────────────────────
  hotel-service:
    build:
      context: ./hotel-service
      dockerfile: Dockerfile
    container_name: tripforge-hotel
    restart: unless-stopped
    ports:
      - "${HOTEL_PORT:-8083}:8083"
    environment:
      SERVER_PORT:      8083
      DB_HOST:          postgres
      DB_PORT:          5432
      DB_NAME:          ${DB_NAME:-tripforge}
      DB_USERNAME:      ${DB_USERNAME:-tripforge_user}
      DB_PASSWORD:      ${DB_PASSWORD:-tripforge_pass}
      EUREKA_URL:       http://discovery-server:8761/eureka/
      ML_SERVICE_URL:   http://ml-service:8087
      JPA_DDL_AUTO:     update
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - tripforge-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 12

  # ── Route Service ───────────────────────────────────────────────────────────
  route-service:
    build:
      context: ./route-service
      dockerfile: Dockerfile
    container_name: tripforge-route
    restart: unless-stopped
    ports:
      - "${ROUTE_PORT:-8084}:8084"
    environment:
      SERVER_PORT:  8084
      DB_HOST:      postgres
      DB_PORT:      5432
      DB_NAME:      ${DB_NAME:-tripforge}
      DB_USERNAME:  ${DB_USERNAME:-tripforge_user}
      DB_PASSWORD:  ${DB_PASSWORD:-tripforge_pass}
      EUREKA_URL:   http://discovery-server:8761/eureka/
      JPA_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - tripforge-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 12

  # ── Budget Service ──────────────────────────────────────────────────────────
  budget-service:
    build:
      context: ./budget-service
      dockerfile: Dockerfile
    container_name: tripforge-budget
    restart: unless-stopped
    ports:
      - "${BUDGET_PORT:-8085}:8085"
    environment:
      SERVER_PORT:  8085
      DB_HOST:      postgres
      DB_PORT:      5432
      DB_NAME:      ${DB_NAME:-tripforge}
      DB_USERNAME:  ${DB_USERNAME:-tripforge_user}
      DB_PASSWORD:  ${DB_PASSWORD:-tripforge_pass}
      EUREKA_URL:   http://discovery-server:8761/eureka/
      JPA_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - tripforge-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 12

  # ── Split Service ───────────────────────────────────────────────────────────
  split-service:
    build:
      context: ./split-service
      dockerfile: Dockerfile
    container_name: tripforge-split
    restart: unless-stopped
    ports:
      - "${SPLIT_PORT:-8086}:8086"
    environment:
      SERVER_PORT:  8086
      DB_HOST:      postgres
      DB_PORT:      5432
      DB_NAME:      ${DB_NAME:-tripforge}
      DB_USERNAME:  ${DB_USERNAME:-tripforge_user}
      DB_PASSWORD:  ${DB_PASSWORD:-tripforge_pass}
      EUREKA_URL:   http://discovery-server:8761/eureka/
      JPA_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - tripforge-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8086/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 12

  # ── ML Service (FastAPI) ────────────────────────────────────────────────────
  # NOTE: saved_models/*.pkl must exist before building.
  # Run: make train   (one-time, before first docker compose up --build)
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: tripforge-ml
    restart: unless-stopped
    ports:
      - "${ML_PORT:-8087}:8087"
    environment:
      DEBUG:       "false"
      ML_WEIGHT:   "0.65"
      RULE_WEIGHT: "0.35"
    networks:
      - tripforge-net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8087/health')\" || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 12

  # ── Frontend (React → Nginx) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: tripforge-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - tripforge-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80 || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 12
